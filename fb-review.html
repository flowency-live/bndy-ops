<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FB Review — Skipped candidates (23)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f4f0; color: #1a1a1a; font-size: 14px; }

  header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 16px; font-weight: 600; }
  #prog { font-size: 13px; color: #666; }

  .toolbar { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 10px 24px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; position: sticky; top: 53px; z-index: 99; }
  .filter-btn { font-size: 12px; padding: 4px 12px; border: 1px solid #ccc; border-radius: 20px; background: #f5f4f0; cursor: pointer; color: #555; }
  .filter-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .spacer { flex: 1; }
  .btn-download { font-size: 13px; padding: 7px 18px; border: 1px solid #1a1a1a; border-radius: 6px; background: #1a1a1a; color: #fff; cursor: pointer; font-weight: 500; }
  .btn-download:hover { background: #333; }

  main { max-width: 820px; margin: 0 auto; padding: 20px 24px 80px; }

  .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 16px 18px; margin-bottom: 10px; }
  .card.decided-approve { border-left: 3px solid #16a34a; background: #f0fdf4; }
  .card.decided-edit   { border-left: 3px solid #2563eb; background: #eff6ff; }
  .card.decided-reject { border-left: 3px solid #dc2626; background: #fef2f2; opacity: 0.7; }

  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .artist-name { font-size: 15px; font-weight: 600; }

  .badges { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: 500; }
  .badge-loc   { background: #dbeafe; color: #1e3a8a; }
  .badge-genre { background: #dcfce7; color: #14532d; }
  .badge-type  { background: #ede9fe; color: #3730a3; }
  .badge-decided { font-size: 11px; padding: 2px 10px; border-radius: 12px; font-weight: 600; white-space: nowrap; }
  .bd-approve { background: #dcfce7; color: #14532d; }
  .bd-edit    { background: #dbeafe; color: #1e3a8a; }
  .bd-reject  { background: #fee2e2; color: #7f1d1d; }

  .fb-link { display: inline-flex; align-items: center; gap: 5px; color: #1877f2; text-decoration: none; font-size: 13px; word-break: break-all; margin-bottom: 6px; }
  .fb-link:hover { text-decoration: underline; }

  .reasoning  { font-size: 12px; color: #555; line-height: 1.5; margin-bottom: 6px; }
  .alternates { font-size: 11px; color: #888; margin-bottom: 8px; }
  .alternates a { color: #2563eb; text-decoration: none; }
  .alternates a:hover { text-decoration: underline; }

  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .btn { font-size: 12px; padding: 5px 13px; border-radius: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer; font-weight: 500; color: #1a1a1a; }
  .btn:hover { background: #f5f4f0; }
  .btn-approve { border-color: #86efac; color: #14532d; background: #f0fdf4; }
  .btn-approve:hover { background: #dcfce7; }
  .btn-reject  { border-color: #fca5a5; color: #7f1d1d; background: #fff5f5; }
  .btn-reject:hover  { background: #fee2e2; }
  .btn-edit-toggle { border-color: #93c5fd; color: #1e3a8a; background: #eff6ff; }

  .edit-row { display: none; margin-top: 10px; gap: 6px; align-items: center; }
  .edit-row.open { display: flex; }
  .edit-input { flex: 1; font-size: 12px; padding: 6px 10px; border: 1px solid #93c5fd; border-radius: 6px; }
  .edit-input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.15); }
  .btn-save { font-size: 12px; padding: 5px 13px; border-radius: 6px; border: 1px solid #86efac; background: #f0fdf4; color: #14532d; cursor: pointer; font-weight: 500; }
  .btn-save:hover { background: #dcfce7; }

  .empty-state { text-align: center; padding: 60px 20px; color: #888; font-size: 15px; }

  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>FB Review — skipped candidates &nbsp;<span style="font-weight:400;color:#888">23 remaining</span></h1>
  <span id="prog">Decided: 0 / 23</span>
</header>

<div class="toolbar">
  <button class="filter-btn active" data-filter="all"     onclick="setFilter('all',this)">All (23)</button>
  <button class="filter-btn"        data-filter="pending" onclick="setFilter('pending',this)">Pending (23)</button>
  <button class="filter-btn"        data-filter="approve" onclick="setFilter('approve',this)">Approved (0)</button>
  <button class="filter-btn"        data-filter="edit"    onclick="setFilter('edit',this)">Edited (0)</button>
  <button class="filter-btn"        data-filter="reject"  onclick="setFilter('reject',this)">Rejected (0)</button>
  <div class="spacer"></div>
  <button class="btn-download" onclick="downloadDecisions()">&#11015; Download decisions JSON</button>
</div>

<main id="main"></main>
<div id="toast"></div>

<script>
const CANDIDATES = [
  {"id":"be3ac69a-5b6d-42b2-81a7-dda75b49328c","name":"JPage","location":"North East","genres":["Pop","Rock"],"facebookUrl":"https://www.facebook.com/jpageuk/","fb_type":"page","reasoning":"facebook.com/jpageuk/ appeared in a targeted search, and JPage is listed as a Pop/Rock band in the North East on onthecasemusic.co.uk — matching both name and genre/region.","alternates":[]},
  {"id":"e57e649d-0f01-4368-9771-4631b61671b7","name":"Steve Steeples","location":"Derby","genres":[],"facebookUrl":"https://www.facebook.com/steve.steeples.5/","fb_type":"profile","reasoning":"Top result for 'Steve Steeples musician Derby facebook'. Distinctive name makes false positive unlikely, though this is a personal profile and Derby location is unconfirmed from snippets.","alternates":["https://www.facebook.com/steven.steeples/"]},
  {"id":"2d17b78f-6cd4-433d-87e4-645c76caac20","name":"Tina LIVE","location":"Derbyshire, UK","genres":[],"facebookUrl":"https://www.facebook.com/TinaLiveShow/","fb_type":"page","reasoning":"Confirmed as 'Tina Live - A Tribute to Tina Turner' with tinalive.co.uk. Search results reference Derbyshire venues, providing regional corroboration.","alternates":[]},
  {"id":"TGgN9cSkqdzYOxh2XaWP","name":"John Connolly","location":"","genres":[],"facebookUrl":"https://www.facebook.com/johnconnollymusicpage/","fb_type":"page","reasoning":"'John Connolly Music Page' found alongside a Bolton entertainment agency listing a UK vocal entertainer named John Connolly who gets regular repeat bookings.","alternates":["https://www.facebook.com/john.connolly.1000/"]},
  {"id":"6ccb1ea4-e4f0-441d-a4e6-341fc8f6855c","name":"Andy Brown","location":"Lancashire","genres":["Rock and Roll"],"facebookUrl":"https://www.facebook.com/andybrownofficial/","fb_type":"page","reasoning":"UK musician born in Liverpool/Lancashire playing rock-infused music, fitting the Lancashire/Rock and Roll genre tag. However this is a solo country-rock artist — may not match a covers band context.","alternates":[]},
  {"id":"9ce6f024-7507-48da-ba53-083daaf774f9","name":"Billy No Mates","location":"North West UK","genres":[],"facebookUrl":"https://www.facebook.com/Billynomatesband/","fb_type":"page","reasoning":"Most prominent UK page by this name. Multiple competing pages exist and none are explicitly confirmed as North West-based.","alternates":["https://www.facebook.com/p/Billy-No-Mates-Band-61560506698688/ (Doncaster)","https://www.facebook.com/bnomatesband/","https://www.facebook.com/The-Billy-no-Mates-65409488798/"]},
  {"id":"14d248af-794c-4b53-bbbb-5044715f2257","name":"DUNCAN OAKLEY","location":"Derby, Derbyshire, UK","genres":[],"facebookUrl":"https://en-gb.facebook.com/public/Duncan-Oakley","fb_type":"profile","reasoning":"Confirmed Midlands-based comedian (Midlands Comedian of the Year 2016, English Comedian of the Year 2015) with Derby connections. Public profile found but no dedicated artist page URL.","alternates":[]},
  {"id":"lAj8OSczz5TnXjtrYZR2","name":"Back to back","location":"","genres":["Rock"],"facebookUrl":"https://www.facebook.com/backtobackrocknrollinfo/","fb_type":"page","reasoning":"The Back to Back Rock n Roll Band from Stoke-on-Trent/Staffordshire and South Cheshire — 4-piece rock band in the right UK region. No location provided for this artist in bndy.","alternates":["https://www.facebook.com/b2babingdon/ (Abingdon/Oxfordshire)"]},
  {"id":"83bd1e96-7b05-49dc-986a-941043532411","name":"Notorious 80s Band","location":"Stoke-on-Trent","genres":["80s"],"facebookUrl":"https://www.facebook.com/profile.php?id=100066760232903","fb_type":"page","reasoning":"Facebook page 'Notorious 80s' appeared in a targeted search. Close name match, but snippet does not confirm Stoke-on-Trent location.","alternates":["https://www.facebook.com/notoriouseighties/ (Birmingham)"]},
  {"id":"126503cb-4c06-4618-8c2d-fb8a15465af4","name":"The Ibiza Band","location":"Hampshire","genres":[],"facebookUrl":"https://www.facebook.com/rockofthepops/","fb_type":"page","reasoning":"The Ibiza Band (aka Rock of the Pops) has a confirmed Facebook page. However Alive Network lists them as Staffordshire-based, not Hampshire — location mismatch.","alternates":["https://www.facebook.com/theibizaprojectband/"]},
  {"id":"c808c7bf-0c3f-46e1-b863-a07e4f997d07","name":"Tahnee","location":"North East England","genres":[],"facebookUrl":"https://www.facebook.com/thisistahne/","fb_type":"page","reasoning":"Facebook page at facebook.com/thisistahne/ appeared in the Newcastle gig search. Name closely matches; snippet did not confirm North East England location explicitly.","alternates":["https://www.facebook.com/tahneerosemusic/ (Tahnee Rose)","https://www.facebook.com/teegeemusic/ (Tahnee Georgia)"]},
  {"id":"dd09c2d6-c888-4699-991f-a966912428d5","name":"Alan soulman","location":"North West UK","genres":[],"facebookUrl":"https://www.facebook.com/public/Alan-Soulman","fb_type":"profile","reasoning":"Public Facebook profile found. Soul musician in Lancashire noted on BandMix corroborating North West. Profile is behind a login wall.","alternates":["https://www.facebook.com/SoulMAN.Band/ (different act)"]},
  {"id":"8ed78c6f-f428-4db3-a002-0c243a0199d5","name":"Mora","location":"North West UK","genres":[],"facebookUrl":"https://www.facebook.com/moraandthefabulouswonderfuls/","fb_type":"page","reasoning":"MORA Music (MORA & the Fabulous Wonderfuls) confirmed as Manchester-based band. North West location matches, but full name differs from 'Mora' alone.","alternates":["https://www.facebook.com/moraband/","https://www.facebook.com/moramusic1/"]},
  {"id":"debcb34c-48aa-45ac-a735-6d6147627540","name":"THE FLANEURS","location":"Derbyshire, UK","genres":[],"facebookUrl":"https://www.facebook.com/flaneurs.band/","fb_type":"page","reasoning":"The Flaneurs appear on Hotvox and have a Facebook page. Described as a classic rock and blues band. Derbyshire location not explicitly confirmed.","alternates":[]},
  {"id":"09b8496a-57ef-41b1-98a2-d5c9d927cb10","name":"The Perrytones","location":"Stoke-on-Trent","genres":["Punk"],"facebookUrl":"https://www.facebook.com/61564442319903/","fb_type":"page","reasoning":"'The Perry Tones' page describes them as an original ska/2-tone live band. Name matches closely (Perrytones vs Perry Tones) and Stoke ska-punk context fits the genre.","alternates":[]},
  {"id":"463df1e8-b3d9-465f-8435-2437dd5f195e","name":"Borderland Band","location":"North West UK","genres":[],"facebookUrl":"https://www.facebook.com/borderlandmusic/","fb_type":"page","reasoning":"Confirmed 6-piece North East function/wedding band based in Newcastle. bndy listing says 'North West UK' but band is NE-based and books across the North West too.","alternates":[]},
  {"id":"c0298ee8-6a9b-4d14-9452-3789941ffb7d","name":"Karnival","location":"North West UK","genres":[],"facebookUrl":"https://www.facebook.com/Karnivalband/","fb_type":"page","reasoning":"Karnivalband is the stronger candidate for a local North West UK band, but no explicit North West location confirmed. Karnivalofficialband (133k likes) is a different international act.","alternates":["https://www.facebook.com/Karnivalofficialband/"]},
  {"id":"541f5747-22d0-41c2-9a87-6650241e44a0","name":"Isabella","location":"Lancashire","genres":["Pop"],"facebookUrl":"https://www.facebook.com/isabellacoulstockmusic/","fb_type":"page","reasoning":"Isabella Coulstock is a Lancashire-based pop singer/songwriter who has supported The Who, Chris Isaak and Jools Holland. Lancashire location and pop genre match.","alternates":[]},
  {"id":"c2f30e82-1064-444e-8d83-4cf4cb6d8731","name":"Paul Gibson","location":"Stoke-on-Trent","genres":[],"facebookUrl":"https://www.facebook.com/gibsonpg/","fb_type":"profile","reasoning":"Direct result for 'Paul Gibson Stoke-on-Trent'. Described as digital creator from Stoke linked to 'thegreatest70spartynight.com' — entertainment context but music evidence is thin.","alternates":["https://www.facebook.com/PaulWilliamGibsonMusic/"]},
  {"id":"LzF90OQmfk15SNm7Drn0","name":"Detour","location":"","genres":[],"facebookUrl":"https://www.facebook.com/UKDetour/","fb_type":"page","reasoning":"Explicitly identified as a 4-piece covers band playing Stereophonics, R.E.M., The Cult, U2 and classic rock, based in Manchester. No location given for this artist in bndy.","alternates":["https://www.facebook.com/DeTourBandUK","https://www.facebook.com/detour.the.band/"]},
  {"id":"5a21aa70-916f-4cf5-8c78-612af3b3d93b","name":"Alexandra James. Vocal Entertainer","location":"Derbyshire, UK","genres":[],"facebookUrl":"https://www.facebook.com/alexandrajamesmusic/","fb_type":"page","reasoning":"facebook.com/alexandrajamesmusic appeared directly for 'Alexandra James vocalist entertainer'. Page name matches exactly with music context, but Derbyshire location was not confirmed.","alternates":["https://www.facebook.com/p/Alexandra-James-61559237886275/"]},
  {"id":"e6e32ab4-7b01-41c4-82d9-04766eef0580","name":"The Original Back To 80's","location":"Derbyshire, UK","genres":[],"facebookUrl":"https://www.facebook.com/backtotheeightiestributeband/","fb_type":"page","reasoning":"Self-describes as 'THE ORIGINAL 1980S TRIBUTE BAND' with 4,400+ likes. Name aligns closely, but the band is Hertfordshire-based rather than Derbyshire.","alternates":["https://www.facebook.com/Backtothe80slive/"]},
  {"id":"070c0441-cfc7-4574-938e-b20a84011b27","name":"Dave Gee","location":"North West UK","genres":[],"facebookUrl":"https://www.facebook.com/davegeemusic/","fb_type":"page","reasoning":"GigHeaven profiles Dave Gee as a singer and saxophone player available for UK gigs. No explicit North West location confirmed.","alternates":["https://www.facebook.com/dave.gee.7528/"]}
];

const STORAGE_KEY = 'fbReview_skipped_v2';
let decisions = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
let currentFilter = 'all';

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(decisions));
  updateProgress();
  updateFilterCounts();
}

function decide(id, decision, url) {
  decisions[id] = { decision, facebookUrl: url || null };
  save();
  renderCard(id);
}

function openEdit(id) {
  const row = document.getElementById('edit-' + id);
  const isOpen = row.classList.contains('open');
  if (!isOpen) {
    row.classList.add('open');
    const inp = document.getElementById('ei-' + id);
    if (!inp.value) inp.value = CANDIDATES.find(c => c.id === id).facebookUrl;
    inp.focus();
  } else {
    row.classList.remove('open');
  }
}

function submitEdit(id) {
  const url = document.getElementById('ei-' + id).value.trim();
  if (!url) return;
  const full = url.startsWith('http') ? url : 'https://' + url;
  decide(id, 'edit', full);
  document.getElementById('edit-' + id).classList.remove('open');
}

function updateProgress() {
  const n = Object.keys(decisions).length;
  document.getElementById('prog').textContent = `Decided: ${n} / ${CANDIDATES.length}`;
}

function updateFilterCounts() {
  const counts = { all: CANDIDATES.length, pending: 0, approve: 0, edit: 0, reject: 0 };
  CANDIDATES.forEach(c => {
    const d = decisions[c.id];
    if (!d) counts.pending++;
    else counts[d.decision] = (counts[d.decision] || 0) + 1;
  });
  document.querySelectorAll('.filter-btn').forEach(b => {
    const f = b.dataset.filter;
    const label = { all:'All', pending:'Pending', approve:'Approved', edit:'Edited', reject:'Rejected' }[f];
    b.textContent = `${label} (${counts[f]})`;
  });
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  CANDIDATES.forEach(c => {
    const el = document.getElementById('card-' + c.id);
    if (el) el.style.display = matchesFilter(c) ? '' : 'none';
  });
}

function matchesFilter(c) {
  if (currentFilter === 'all') return true;
  if (currentFilter === 'pending') return !decisions[c.id];
  return decisions[c.id] && decisions[c.id].decision === currentFilter;
}

function renderCard(id) {
  const c = CANDIDATES.find(x => x.id === id);
  let el = document.getElementById('card-' + id);
  if (!el) {
    el = document.createElement('div');
    el.id = 'card-' + id;
    document.getElementById('main').appendChild(el);
  }
  const d = decisions[id];
  el.style.display = matchesFilter(c) ? '' : 'none';
  el.className = 'card' + (d ? ` decided-${d.decision}` : '');

  const labels = { approve:'Approved ✓', edit:'Edited ✓', reject:'Rejected' };
  const cls    = { approve:'bd-approve', edit:'bd-edit', reject:'bd-reject' };
  const badge  = d ? `<span class="badge-decided ${cls[d.decision]}">${labels[d.decision]}</span>` : '';

  const alts = c.alternates && c.alternates.length
    ? `<div class="alternates">Alternates: ${c.alternates.map(a => {
        const url = a.split(' ')[0];
        return `<a href="${url}" target="_blank">${a}</a>`;
      }).join(' &middot; ')}</div>`
    : '';

  const genreBadges = (c.genres||[]).map(g => `<span class="badge badge-genre">${g}</span>`).join('');
  const locBadge = c.location ? `<span class="badge badge-loc">&#128205; ${c.location}</span>` : '';
  const currentUrl = (d && d.facebookUrl) ? d.facebookUrl : c.facebookUrl;

  el.innerHTML = `
    <div class="card-head">
      <span class="artist-name">${c.name}</span>
      ${badge}
    </div>
    <div class="badges">${locBadge}${genreBadges}<span class="badge badge-type">${c.fb_type}</span></div>
    <a class="fb-link" href="${c.facebookUrl}" target="_blank">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="#1877f2"><path d="M24 12.073C24 5.404 18.627 0 12 0S0 5.404 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97h-1.513c-1.491 0-1.956.93-1.956 1.886v2.267h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/></svg>
      ${c.facebookUrl}
    </a>
    <p class="reasoning">${c.reasoning}</p>
    ${alts}
    <div class="actions">
      <button class="btn btn-approve" onclick="decide('${id}','approve','${c.facebookUrl}')">&#10003; Approve</button>
      <button class="btn btn-edit-toggle" onclick="openEdit('${id}')">&#9998; Edit URL</button>
      <button class="btn btn-reject" onclick="decide('${id}','reject',null)">&#10007; Reject</button>
    </div>
    <div class="edit-row" id="edit-${id}">
      <input class="edit-input" id="ei-${id}" type="text" placeholder="Paste correct Facebook URL here" />
      <button class="btn-save" onclick="submitEdit('${id}')">Save &amp; approve</button>
    </div>
  `;
}

function downloadDecisions() {
  const decided = CANDIDATES
    .filter(c => decisions[c.id])
    .map(c => ({ id: c.id, name: c.name, decision: decisions[c.id].decision, facebookUrl: decisions[c.id].facebookUrl }));
  if (!decided.length) { toast('No decisions yet!'); return; }
  const blob = new Blob([JSON.stringify(decided, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'fb-review-decisions.json';
  a.click();
  toast(`Downloaded ${decided.length} decisions`);
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Init — render all cards
CANDIDATES.forEach(c => renderCard(c.id));
updateProgress();
updateFilterCounts();
</script>
</body>
</html>
